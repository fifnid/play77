<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101018"><title>Крутка — рулетка удачи</title>
<style>
:root{color-scheme:dark;--bg:#101018;--panel:#1a1a27;--muted:#a5a5b8;--pink:#ff4f9a;--gold:#ffd166;--cyan:#63e6d4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#29203b 0%,#101018 60%);color:#fff;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;justify-content:center;padding:32px 18px}.app{width:min(100%,760px);text-align:center}.brand{font-weight:900;font-size:14px;letter-spacing:.2em;color:var(--pink);text-transform:uppercase}.brand span{color:white}h1{font-size:clamp(38px,8vw,68px);line-height:1.05;margin:12px 0 10px;letter-spacing:-.05em}.subtitle{color:var(--muted);margin:0 auto 24px}.stats{display:flex;justify-content:center;gap:12px;margin-bottom:22px}.stat{background:#ffffff0b;border:1px solid #ffffff15;border-radius:14px;padding:9px 18px;color:var(--muted);font-size:14px}.stat b{display:block;color:white;font-size:20px}.wheel-wrap{position:relative;width:min(78vw,390px);aspect-ratio:1;margin:0 auto 24px;filter:drop-shadow(0 18px 32px #0008)}.pointer{position:absolute;z-index:3;top:-10px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-top:34px solid var(--gold);filter:drop-shadow(0 3px 2px #0008)}.wheel{width:100%;height:100%;border-radius:50%;border:9px solid #f9ebff;background:conic-gradient(#fd598b 0deg 45deg,#854df4 45deg 90deg,#24b9b1 90deg 135deg,#f2a93b 135deg 180deg,#fd598b 180deg 225deg,#854df4 225deg 270deg,#24b9b1 270deg 315deg,#f2a93b 315deg 360deg);position:relative;transition:transform 4.2s cubic-bezier(.12,.75,.12,1);box-shadow:inset 0 0 0 3px #ffffff75}.wheel:after{content:"";position:absolute;inset:46%;border:5px solid white;border-radius:50%;background:#1a1a27;box-shadow:0 0 0 5px #ffffff35}.label{position:absolute;left:50%;top:50%;width:75px;margin-left:-37.5px;margin-top:-13px;font-weight:900;font-size:17px;text-shadow:0 2px 4px #0006}.label:nth-child(1){transform:rotate(22.5deg) translateY(-133px)}.label:nth-child(2){transform:rotate(67.5deg) translateY(-133px)}.label:nth-child(3){transform:rotate(112.5deg) translateY(-133px)}.label:nth-child(4){transform:rotate(157.5deg) translateY(-133px)}.label:nth-child(5){transform:rotate(202.5deg) translateY(-133px)}.label:nth-child(6){transform:rotate(247.5deg) translateY(-133px)}.label:nth-child(7){transform:rotate(292.5deg) translateY(-133px)}.label:nth-child(8){transform:rotate(337.5deg) translateY(-133px)}button{border:0;border-radius:999px;padding:15px 34px;font:800 17px system-ui;cursor:pointer;color:#23101d;background:linear-gradient(100deg,#ff70a9,#ffd166);box-shadow:0 7px 25px #ff4f9a44;transition:transform .15s,filter .15s}button:hover{transform:translateY(-2px);filter:brightness(1.08)}button:active{transform:scale(.97)}button:disabled{opacity:.65;cursor:wait}.message{min-height:58px;margin:15px 0 8px;font-weight:700;font-size:21px}.message small{display:block;color:var(--muted);font-size:14px;font-weight:400}.hint{color:var(--muted);font-size:13px;margin-top:22px}.reset{background:none;box-shadow:none;color:var(--muted);padding:8px 12px;font-size:13px}.reset:hover{color:white}.spark{color:var(--gold)}@media(max-width:430px){.label{font-size:14px;width:62px;margin-left:-31px}.label:nth-child(n){transform-origin:50% 13px}.label:nth-child(1){transform:rotate(22.5deg) translateY(-112px)}.label:nth-child(2){transform:rotate(67.5deg) translateY(-112px)}.label:nth-child(3){transform:rotate(112.5deg) translateY(-112px)}.label:nth-child(4){transform:rotate(157.5deg) translateY(-112px)}.label:nth-child(5){transform:rotate(202.5deg) translateY(-112px)}.label:nth-child(6){transform:rotate(247.5deg) translateY(-112px)}.label:nth-child(7){transform:rotate(292.5deg) translateY(-112px)}.label:nth-child(8){transform:rotate(337.5deg) translateY(-112px)}}
</style></head>
<body><main class="app"><div class="brand">✦ <span>Крутка</span> ✦</div><h1>Испытай удачу</h1><p class="subtitle">Крути колесо и собери как можно больше звёзд!</p><div class="stats"><div class="stat">⭐ Очки<b id="score">0</b></div><div class="stat">🎟 Крутки<b id="spins">0</b></div></div><div class="wheel-wrap"><div class="pointer"></div><div class="wheel" id="wheel"><span class="label">+10</span><span class="label">+25</span><span class="label">+5</span><span class="label">+50</span><span class="label">+15</span><span class="label">+100</span><span class="label">+5</span><span class="label">+30</span></div></div><button id="spin">КРУТИТЬ!</button><div class="message" id="message">Готов к крутке? <small>Нажми кнопку — посмотрим, что выпадет!</small></div><div class="hint">Результат случаен. Удачи! ✨</div><button class="reset" id="reset">Сбросить прогресс</button></main>
<script>
const prizes=[10,25,5,50,15,100,5,30];let score=Number(localStorage.getItem('spinScore'))||0,spins=Number(localStorage.getItem('spinCount'))||0,rotation=0,busy=false;const wheel=document.querySelector('#wheel'),button=document.querySelector('#spin'),message=document.querySelector('#message');function update(){document.querySelector('#score').textContent=score;document.querySelector('#spins').textContent=spins;localStorage.setItem('spinScore',score);localStorage.setItem('spinCount',spins)}update();button.addEventListener('click',()=>{if(busy)return;busy=true;button.disabled=true;message.textContent='Колесо крутится…';const index=Math.floor(Math.random()*prizes.length);rotation+=360*5+(360-index*45-22.5-rotation%360+360)%360;wheel.style.transform=`rotate(${rotation}deg)`;setTimeout(()=>{const prize=prizes[index];score+=prize;spins++;update();message.innerHTML=`<span class="spark">✨ Выпало +${prize} очков! ✨</span><small>${prize>=50?'Вот это удача!':'Крути ещё раз и побей рекорд!'}</small>`;button.disabled=false;busy=false},4200)});document.querySelector('#reset').addEventListener('click',()=>{if(confirm('Сбросить очки и количество круток?')){score=0;spins=0;update();message.innerHTML='Прогресс сброшен.<small>Время начать заново!</small>'}});
</script></body></html>
